name: Byg Kassesystem APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Gendan Android-projekt
        shell: bash
        run: |
          echo '' | base64 --decode > project.tgz
          tar -xzf project.tgz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Installer Android SDK 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"
      - name: Byg APK
        run: |
          sed -i "s/8.9.2/9.2.1/" build.gradle
          sed -i "s/compileSdk 36/compileSdk 37/" app/build.gradle
          gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KasseSystem-Android16-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
