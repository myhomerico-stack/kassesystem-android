name: Byg Kassesystem APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Gendan Android-projekt
        shell: bash
        run: |
          echo '' | base64 --decode > project.tgz
          tar -xzf project.tgz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Installer Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Hent StarPRNT SDK
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 -o app/libs/stario.aar "https://repo1.maven.org/maven2/com/starmicronics/stario/2.14.3/stario-2.14.3.aar"
          curl --fail --location --retry 3 -o app/libs/starioextension.aar "https://repo1.maven.org/maven2/com/starmicronics/starioextension/1.17.1/starioextension-1.17.1.aar"
          zip -d app/libs/stario.aar META-INF/com/android/build/gradle/aar-metadata.properties
          zip -d app/libs/starioextension.aar META-INF/com/android/build/gradle/aar-metadata.properties
      - name: Byg APK
        run: |
          gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KasseSystem-Android16-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
